name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: make app

  homebrew:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The runner image's brew lags; audit against the brew users install with, which is the one
      # that knows postflight_steps and rejects the legacy postflight block.
      - run: brew update
      # brew style and audit only apply the cask rules to a tapped cask, so the checkout is linked in as the
      # mythofmeat/hide-hidden tap.
      - run: |
          mkdir -p "$(brew --repository)/Library/Taps/mythofmeat"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/mythofmeat/homebrew-hide-hidden"
      - run: brew style --cask mythofmeat/hide-hidden/hide-hidden
      - run: brew audit --cask --strict mythofmeat/hide-hidden/hide-hidden
